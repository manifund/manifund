<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manifund Recon</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Manifund Recon</h1>
      <nav id="tabs">
        <button data-tab="import">Import</button>
        <button data-tab="matching" class="active">Matching</button>
        <button data-tab="overview">Overview</button>
      </nav>
      <div id="window-picker">
        <label
          title="Times are optional and in your local time zone; a date alone covers the whole UTC day"
          >Window <input type="date" id="win-start" /><input type="time" id="win-start-time" /> –
          <input type="date" id="win-end" /><input type="time" id="win-end-time"
        /></label>
      </div>
      <div id="status"></div>
    </header>
    <main id="main"></main>
    <script src="/app.js"></script>
  </body>
</html>
